<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5c6bc0"/>
      <stop offset="100%" style="stop-color:#3949ab"/>
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e8eaf6;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Sfondo -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Scopa stilizzata -->
  <g transform="translate(96,96)">
    <!-- Manico scopa -->
    <rect x="-4" y="-55" width="8" height="80" rx="4" fill="url(#icon)"/>
    <!-- Testina scopa -->
    <ellipse cx="0" cy="32" rx="35" ry="14" fill="url(#icon)" opacity="0.9"/>
    <!-- Setole -->
    <line x1="-30" y1="32" x2="-36" y2="52" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="-18" y1="34" x2="-20" y2="56" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="-6"  y1="36" x2="-6"  y2="58" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="6"   y1="36" x2="6"   y2="58" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="18"  y1="34" x2="20"  y2="56" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="30"  y1="32" x2="36"  y2="52" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- Luccichio -->
    <circle cx="28" cy="-42" r="5" fill="white" opacity="0.6"/>
    <circle cx="40" cy="-30" r="3" fill="white" opacity="0.4"/>
  </g>
</svg>
