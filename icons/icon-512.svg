<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5c6bc0"/>
      <stop offset="100%" style="stop-color:#3949ab"/>
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8eaf6"/>
    </linearGradient>
  </defs>
  <!-- Sfondo -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Scopa stilizzata -->
  <g transform="translate(256,256)">
    <!-- Manico scopa -->
    <rect x="-11" y="-145" width="22" height="210" rx="11" fill="url(#icon)"/>
    <!-- Testina scopa -->
    <ellipse cx="0" cy="84" rx="90" ry="36" fill="url(#icon)" opacity="0.9"/>
    <!-- Setole -->
    <line x1="-76" y1="84" x2="-92" y2="138" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <line x1="-48" y1="90" x2="-56" y2="148" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <line x1="-16" y1="94" x2="-16" y2="154" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <line x1="16"  y1="94" x2="16"  y2="154" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <line x1="48"  y1="90" x2="56"  y2="148" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <line x1="76"  y1="84" x2="92"  y2="138" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <!-- Luccichio -->
    <circle cx="74"  cy="-112" r="13" fill="white" opacity="0.6"/>
    <circle cx="105" cy="-80"  r="8"  fill="white" opacity="0.4"/>
    <circle cx="56"  cy="-130" r="6"  fill="white" opacity="0.3"/>
  </g>
</svg>
